[package]
name = "steamworks-command"
version = "0.1.0"
authors = ["Zeyl"]
description = "steamworks command line tool"
license = "MIT"
repository = "https://gitcode.com/zeyl/steamworks-command"
edition = "2024"
build = "build.rs"

[dependencies]
steamworks = { path = "./steamworks-rs" }
tokio = { version = "1.44.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"

[profile.release]
lto = true        # 链接时优化
codegen-units = 1 # 提升优化效果
panic = "abort"   # 减小体积
strip = true      # 移除调试符号
opt-level = "z"   # 最小体积优化
